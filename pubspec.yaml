name: langreels_ai
description: AI-powered language learning platform with TikTok-style videos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
   
  # Firebase & Google Services - UPDATED VERSIONS
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0 # ADDED FOR APPLE SIGN-IN
   
  # Video & Camera
  video_player: ^2.8.1
  image_picker: ^1.0.4
  camera: ^0.10.5+5
     
  # State Management & Utils
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
   
  # UI & Animations
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
   
  # Utils & Networking
  intl: ^0.19.0
  path: ^1.8.3
  http: ^1.1.2
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0
  path_provider: ^2.1.1
   
  # Permissions
  permission_handler: ^11.1.0
   
  # SHARING DEPENDENCIES
  share_plus: ^7.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
     
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/app_icon.png
   
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true